[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wbexplorer"
version = "0.0.1"
readme = "README.md"

dependencies = [
    "fake-useragent>=1.5.1",
    "requests>=2.32.3",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5"
]
requires-python = ">= 3.9"

[tool.hatch.build.targets.wheel]
packages = ["src/wbexplorer"]
